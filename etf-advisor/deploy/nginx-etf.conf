limit_req_zone $binary_remote_addr zone=data_limit:1m rate=10r/s;

server {
    listen 8088;
    server_name _;

    root /opt/etf-advisor/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin API → proxy to admin_server.py
    location /admin/api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Admin 页面
    location /admin/ {
        try_files $uri /admin.html;
    }

    # JSON data → proxy to admin_server (visitor tracking)
    location ~ ^/data/(.+\.json)$ {
        limit_req zone=data_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Device-Id $http_x_device_id;
        proxy_set_header Host $host;
    }

    # 429 自定义错误页
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访问繁忙</title><style>body{display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:-apple-system,sans-serif;background:#faf9f7;color:#1a1613}div{text-align:center;padding:2rem}h1{font-size:1.5rem;margin-bottom:.5rem}p{color:#666;font-size:.9rem}</style></head><body><div><h1>访问繁忙</h1><p>请稍后再试</p></div></body></html>';
    }

    # 其余数据文件：静态，不缓存
    location /data/ {
        alias /opt/etf-advisor/data/;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    # app.js / rotation.js 频繁更新，短缓存
    location ~* ^/(app|rotation|data)\.js$ {
        expires 1h;
    }

    # 静态资源：长期缓存
    location /vendor/ {
        expires 30d;
    }
    location ~* \.(css)$ {
        expires 7d;
    }
}
